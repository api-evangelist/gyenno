aid: gyenno
name: GYENNO
description: >-
  GYENNO is a medical technology company that designs assistive devices and
  digital-health tools for people living with Parkinson's disease and other
  movement disorders. Its consumer product line includes the GYENNO Bravo
  anti-tremor eating utensil (a stabilizing, weighted spoon/fork that counteracts
  hand tremor) and the GYENNO Skywalk portable freezing-of-gait mobility aid that
  projects a visual laser cue to help users resume walking, alongside a range of
  adaptive and weighted utensils and daily-living aids. GYENNO was surfaced as a
  portfolio company of Qiming Venture Partners and added to the API Evangelist
  network. As of this enrichment pass the company publishes a consumer marketing
  site only and exposes no public developer portal, API documentation, or
  machine-readable API surface.
